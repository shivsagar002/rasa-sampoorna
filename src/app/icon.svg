<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="rasaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E2A20" />
      <stop offset="50%" stop-color="#6B1D16" />
      <stop offset="100%" stop-color="#4A120D" />
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF7ED" />
      <stop offset="50%" stop-color="#E5C799" />
      <stop offset="100%" stop-color="#C29B58" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Gold Rim -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#rasaBg)" stroke="url(#goldStroke)" stroke-width="1.5" />

  <!-- Inner Soft Golden Frame -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="11" fill="none" stroke="#E5C799" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- RASA Heart-Lotus Artisan Emblem -->
  <g filter="url(#subtleGlow)" fill="none" stroke="url(#goldStroke)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Sacred Heart Petal -->
    <path
      d="M32 50C32 50 14 38.5 14 26C14 19.8 19 15 25.2 15C28.2 15 30.8 16.5 32 18.7C33.2 16.5 35.8 15 38.8 15C45 15 50 19.8 50 26C50 38.5 32 50 32 50Z"
      stroke-width="2.6"
    />
    <!-- Inner Lotus Flame / Bud -->
    <path
      d="M32 19.5C32 19.5 27.5 28 27.5 34C27.5 37.5 29.8 40 32 40C34.2 40 36.5 37.5 36.5 34C36.5 28 32 19.5 32 19.5Z"
      stroke-width="2.2"
    />
    <!-- Cradle / Smile Foundation Arc -->
    <path
      d="M21.5 35.5C24.5 38.5 29 40.5 32 40.5C35 40.5 39.5 38.5 42.5 35.5"
      stroke-width="2"
    />
  </g>
</svg>
